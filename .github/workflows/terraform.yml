name: Terraform CI/CD Demo (No Cloud)

on:
  push:
    branches:
      - cicd-demo

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      # ✅ 2. ตรวจสอบว่า authentication สำเร็จไหม
      - name: 🧪 Who am I?
        run: |
          gcloud auth list

      # ✅ 3. ทดสอบการเข้าถึง GCS ด้วย gsutil
      - name: 📤 Test GCS access with gsutil
        run: |
          gsutil ls gs://ci-cd_for_test/

      # ✅ 4. Checkout repository (ควรอยู่บนสุด แต่ไม่ critical)
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # ❌ ตัวอย่าง: Comment block นี้ออก (หากไม่ต้องการรัน)
