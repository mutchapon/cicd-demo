name: Terraform CI/CD Demo (No Cloud)

on:
  push:
    branches:
      - cicd-demo

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3

    - name: ⚙️ Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.8.0  # อัปเดตให้ใหม่ขึ้น

    - name: ✅ Terraform Format Check
      run: terraform fmt -check

    - name: 🚀 Terraform Init
      run: terraform init

    - name: 🧪 Terraform Validate
      run: terraform validate

    - name: 🧠 Terraform Plan
      run: terraform plan

    - name: 🔧 Terraform Apply
      run: terraform apply -auto-approve

    - name: 📄 Show generated file
      run: cat hello.txt

    - name: 📦 Upload hello.txt as artifact
      uses: actions/upload-artifact@v4
      with:
        name: hello-txt
        path: hello.txt
    - name: 🔑 Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: 📤 Upload hello.txt to GCS with timestamp
      run: |
        export FILE_NAME="hello-$(date +%s).txt"
        echo "Uploading as $FILE_NAME"
        gsutil cp hello.txt gs://ci-cd_for_test/$FILE_NAME

